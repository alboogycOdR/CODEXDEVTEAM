name: kernel-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernel-bootstrap:
    name: bootstrap / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile kernel package
        run: python -m compileall -q src
      - name: Install kernel package
        run: python -m pip install .
      - name: Smoke installed command entry points
        run: |
          codexdevteam --help
          codexdevteam-test --help
          codexdevteam-control --help
          codexdevteam-fast-eval --help
      - name: Smoke Codex hook entry point
        run: >-
          python -c "import json, subprocess; result = subprocess.run(['codexdevteam-codex-hook'], input='{}', text=True, capture_output=True, check=True); reply = json.loads(result.stdout); assert reply['hookSpecificOutput']['permissionDecision'] == 'deny'"
      - name: Import kernel package
        shell: bash
        run: PYTHONPATH=src python -c "import codexdevteam_kernel"
      - name: Kernel contract suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
